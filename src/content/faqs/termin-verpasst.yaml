question: "Was passiert, wenn mein Kind einen Termin verpasst?"
answer: "Sollte Ihr Kind einmal nicht teilnehmen können, bitten wir um eine kurze Mitteilung. Ein Anspruch auf einen Ersatztermin besteht nicht. Sofern am selben Tag in der anderen Kursgruppe ein Platz frei ist und der Unterrichtsinhalt passt, versuchen wir gerne, eine Teilnahme zu ermöglichen. Ein Nachholen können wir jedoch nicht garantieren."
